<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tilespace demo</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; gap: 12px; color: #222; background: #f4f4f6; }
      nav { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; position: relative; z-index: 1; background: #f4f4f6; box-shadow: 0 -16px 0 16px #f4f4f6, 0 12px 0 #f4f4f6; }
      nav h1 { font-size: 18px; margin: 0 auto 0 0; }
      [aria-pressed="true"] { font-weight: 600; }
      /* The Stage's height comes from the page, never from its content (GOTCHAS "DOM"). */
      .stage { flex: 1 1 0; min-width: 0; }
      /* The frame clips; with Peek it leaves room beside the Stage for the neighbouring Spaces. */
      .frame { flex: 1 1 0; min-height: 0; display: flex; overflow: hidden; }
      /* Inset: the frame is the site's width and makes room inside, so the Stage shrinks. */
      .frame.inset { padding: 0 64px; }
      .frame.inset.vertical { padding: 64px 0; }
      /* Bleed: the Stage keeps its container's width and the neighbours spill past it, clipped by
         the screen; the nav covers the one above, and the page's gap. */
      .frame.bleed { overflow: visible; }
      html:has(.frame.bleed), html:has(.frame.bleed) body { overflow: clip; }
      /* Centred: the frame spans the screen, and the Stage keeps a 1040 px site's width, centred. */
      /* -16px: out to the screen's edges, past the body's padding. Under 1040 px there's no margin. */
      .frame.centred { margin: 0 -16px; }
      .frame.centred .stage { max-width: 1040px; margin: 0 auto; }
      /* Vertically the neighbours come from above and below: the Stage leaves room there instead. */
      .frame.centred.vertical .stage { max-width: none; max-height: calc(100% - 160px); align-self: center; height: 100%; margin: 0 16px; }
      /* The Tile is bare; its card fills it, and the card effects animate the card (DEC-06). */
      .stage > div > .card { box-sizing: border-box; height: 100%; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; overflow: hidden; background: hsl(var(--hue) 55% 78%); }
      .stage > div { position: relative; }
      .stage > div:nth-child(4n + 1) { --hue: 210; }
      .stage > div:nth-child(4n + 2) { --hue: 150; }
      .stage > div:nth-child(4n + 3) { --hue: 35; }
      .stage > div:nth-child(4n + 4) { --hue: 330; }
      /* The Tile's place in the HTML, to read the fill order (left to right, row by row) on screen. */
      #stage { counter-reset: tile; }
      #stage > div { counter-increment: tile; }
      #stage .card::before { content: counter(tile); font-size: 12px; font-weight: 600; }
      #stage > div::after { content: attr(data-ts-span); font-size: 12px; opacity: 0.6; position: absolute; right: 10px; bottom: 10px; pointer-events: none; }
      #gallery .card { padding: 0; position: relative; }
      #gallery img { width: 100%; height: 100%; object-fit: cover; }
      #gallery span { position: absolute; left: 10px; bottom: 8px; color: #fff; }
      #gap, #space-gap { width: 4em; }
      #dashboard textarea, #dashboard input:not([type]) { width: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <nav>
      <h1>tilespace</h1>
      <span>
        <button type="button" data-example="stage" aria-pressed="true">Showcase</button>
        <button type="button" data-example="gallery" aria-pressed="false">Gallery</button>
        <button type="button" data-example="dashboard" aria-pressed="false">Dashboard</button>
      </span>
      <label>Transition
        <select id="transition">
          <option value="slide">Slide</option>
          <option value="fade">Fade (custom)</option>
          <option value="none">None</option>
        </select>
      </label>
      <label>Cards
        <select id="cards">
          <option value="none">none</option>
          <option value="cascade">cascade</option>
          <option value="3d">3-D cascade</option>
          <option value="pop">pop</option>
        </select>
      </label>
      <label>Axis
        <select id="axis"><option>horizontal</option><option>vertical</option></select>
      </label>
      <label>Holes
        <select id="holes"><option>end</option><option>order</option></select>
      </label>
      <label>Gap <input id="gap" type="number" min="0" max="48" step="4" value="12" /></label>
      <label>Space gap <input id="space-gap" type="number" min="0" max="200" step="8" value="12" /></label>
      <label><input id="loop" type="checkbox" /> Loop</label>
      <label>Peek
        <select id="peek">
          <option value="off">off</option>
          <option value="inset">inset</option>
          <option value="bleed">bleed</option>
          <option value="centred">bleed, centred</option>
        </select>
      </label>
      <button id="prev" type="button">Prev</button>
      <span id="space" aria-live="polite"></span>
      <button id="next" type="button">Next</button>
      <button id="toggle" type="button">Destroy</button>
    </nav>
    <div id="frame" class="frame">
    <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: the Stage keeps the focus when the Tile holding it hides, so the keys keep moving -->
    <div id="stage" class="stage" tabindex="0" style="row-gap: 12px;">
      <div data-ts-shape="3x2 2x2"><div class="card">Weather</div></div>
      <div data-ts-shape="1x1" style="grid-column-start: 1;"><div class="card">Clock</div></div>
      <div data-ts-shape="2x1"><div class="card">Battery</div></div>
      <div data-ts-shape="2x3 2x2"><div class="card">Calendar</div></div>
      <div data-ts-shape="1x2"><div class="card">Volume</div></div>
      <div data-ts-shape="1x1"><div class="card">Timer <button id="timer" type="button">Start</button></div></div>
      <div data-ts-shape="4x2 3x2 2x2"><div class="card">Photos</div></div>
      <div data-ts-shape="2x2"><div class="card">Notes</div></div>
      <div data-ts-shape="1x1"><div class="card">Wi-Fi</div></div>
      <div data-ts-shape="3x1 2x1"><div class="card">Music</div></div>
      <div data-ts-shape="2x2 1x1"><div class="card">Stocks</div></div>
      <div data-ts-shape="1x1"><div class="card">Focus</div></div>
      <div data-ts-shape="2x1"><div class="card">Reminders</div></div>
      <div data-ts-shape="1x3 1x2"><div class="card">News</div></div>
    </div>
    <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: as the showcase's Stage, it keeps the focus for the keys -->
    <div id="gallery" class="stage" tabindex="0" hidden></div>
    <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: as the showcase's Stage, it keeps the focus for the keys -->
    <div id="dashboard" class="stage" tabindex="0" hidden></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
