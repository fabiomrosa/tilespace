<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tilespace</title>
    <meta name="description" content="Pack your own elements into pages of a grid, and move between them like desktop workspaces." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" />
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/layout.css" />
    <style>
      /* T3.7a's placeholder wall, until the hero's (T3.8). */
      #wall { height: 320px; }
    </style>
  </head>
  <body>
    <header class="container site-header">
      <a class="logo" href="#top"><span class="logo-mark" aria-hidden="true"><span></span><span></span><span></span></span>tilespace</a>
      <div class="header-actions">
        <nav class="main-nav" aria-label="Main">
          <ul>
            <li><a href="#playground">Playground</a></li>
            <li><a href="#quick-start">Quick start</a></li>
            <li><a href="#lab">The lab</a></li>
            <li><a href="https://github.com/fabiomrosa/tilespace">GitHub</a></li>
          </ul>
        </nav>
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Switch theme">
          <svg class="sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          <svg class="moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
        </button>
      </div>
    </header>

    <main id="top" class="container">
      <h1>tilespace</h1>
      <!-- biome-ignore lint/a11y/noNoninteractiveTabindex: the Stage keeps the focus, so the arrow keys keep moving -->
      <div id="wall" tabindex="0">
        <div data-ts-shape="2x2">1</div>
        <div>2</div>
        <div>3</div>
        <div data-ts-shape="2x1">4</div>
        <div>5</div>
      </div>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
